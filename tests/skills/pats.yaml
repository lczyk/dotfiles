# agent-config eval via pats (https://github.com/lczyk/pats): does an agent
# seeded with this repo's instructions, styles and hooks behave as they say?
# run:   cd tests/skills && pats run      # runs the agent(s) in docker -- slow, live
# score: cd tests/skills && pats score    # scores the latest run, offline
# needs pats >= 0.7.3 (PATS_AGENT_HOME). pats builds the image itself.

sandboxes:
  # the stock pats image plus jq, which the safety hooks need on every call.
  - id: docker
    kind: container
    driver: docker
    build: .

# single sandbox defined -> it's the default.
agents:
  - id: haiku
    kind: claude-cli-keyless
    model: claude-haiku-5-5

# prepare seeds the agent's HOME with the stow packages (tasks/_lib.sh) and
# builds the task's fixture repo. each task's setup lives in
# tasks/prepare_<id>.sh. collect is uniform (tasks/collect.sh).
tasks:
  # harness check: the seeded hooks fire and their text reaches the agent.
  # every other result is meaningless while this one fails.
  - id: canary
    prompt: prompts/${id}.txt
    prepare: tasks/prepare_${id}.sh
    collect: tasks/collect.sh
    timeout: 5m
  # lofi: the writing style, on a small python repo (cases/ratelimit). each task
  # tempts a different slip. the prompts never mention the style.
  # chat reply walking through code -- headings, capitals, filler.
  - id: lofi-explain
    prompt: prompts/${id}.txt
    prepare: tasks/prepare_${id}.sh
    collect: tasks/collect.sh
  # PR text -- template-ish capitalised headings, bold, emoji, enthusiasm.
  - id: lofi-pr-body
    prompt: prompts/${id}.txt
    prepare: tasks/prepare_${id}.sh
    collect: tasks/collect.sh
  # a commit message for a fix already in the worktree.
  - id: lofi-commit
    prompt: prompts/${id}.txt
    prepare: tasks/prepare_${id}.sh
    collect: tasks/collect.sh
  # the carve-out: edit formal docs in their own style, reply in lofi.
  - id: lofi-docs-match
    prompt: prompts/${id}.txt
    prepare: tasks/prepare_${id}.sh
    collect: tasks/collect.sh
  # the skill itself: "lofi off" must flip its state file.
  - id: lofi-toggle
    prompt: prompts/${id}.txt
    prepare: tasks/prepare_${id}.sh
    collect: tasks/collect.sh
    timeout: 5m

# each scorer is a standalone uv script scorers/scorer_<id>.py (shared helpers
# in scorers/_lib.py). first stdout line = float [0,1] or `na`. the lofi prose
# scorers read the reply + the agent's commit messages and are `na` on tasks
# where lofi doesn't apply.
scorers:
  - {id: canary-hooks,    score: "scorers/scorer_${id}.py"}
  - {id: canary-context,  score: "scorers/scorer_${id}.py"}
  - {id: lofi-ascii,      score: "scorers/scorer_${id}.py"}
  - {id: lofi-lowercase,  score: "scorers/scorer_${id}.py"}
  - {id: lofi-banned,     score: "scorers/scorer_${id}.py"}
  - {id: lofi-joiners,    score: "scorers/scorer_${id}.py"}
  - {id: lofi-acronyms,   score: "scorers/scorer_${id}.py"}
  - {id: lofi-format,     score: "scorers/scorer_${id}.py"}
  - {id: lofi-enthusiasm, score: "scorers/scorer_${id}.py"}
  - {id: lofi-pr-preamble, score: "scorers/scorer_${id}.py"}
  - {id: lofi-docs-case,  score: "scorers/scorer_${id}.py"}
  - {id: lofi-toggle-off, score: "scorers/scorer_${id}.py"}

suites:
  - id: canary
    agents: haiku
    tasks: canary
    scorers:
      - canary-hooks
      - canary-context
      #
  - id: lofi
    agents: haiku
    tasks:
      - lofi-explain
      - lofi-pr-body
      - lofi-commit
      - lofi-docs-match
      - lofi-toggle
      #
    scorers:
      - lofi-ascii
      - lofi-lowercase
      - lofi-banned
      - lofi-joiners
      - lofi-acronyms
      - lofi-format
      - lofi-enthusiasm
      - lofi-pr-preamble
      - lofi-docs-case
      - lofi-toggle-off
      #
