default_model = "kimi-code/k3.1-pro"

[providers."managed:kimi-code"]
type = "kimi"
api_key = ""
base_url = "https://api.kimi.com/coding/v1"

[providers."managed:kimi-code".oauth]
storage = "file"
key = "oauth/kimi-code"

[models."kimi-code/kimi-for-coding"]
provider = "managed:kimi-code"
model = "kimi-for-coding"
max_context_size = 1048576
capabilities = [ "thinking", "always_thinking", "image_in", "video_in", "tool_use", "dynamically_loaded_tools" ]
display_name = "K2.8 Preview"
support_efforts = [ "low", "high", "max" ]
default_effort = "max"

[models."kimi-code/kimi-for-coding-highspeed"]
provider = "managed:kimi-code"
model = "kimi-for-coding-highspeed"
max_context_size = 262144
capabilities = [ "thinking", "always_thinking", "image_in", "video_in", "tool_use" ]
display_name = "K2.7 Code Highspeed"

[models."kimi-code/k3-256k"]
provider = "managed:kimi-code"
model = "k3-256k"
max_context_size = 262144
capabilities = [ "thinking", "always_thinking", "image_in", "tool_use", "dynamically_loaded_tools" ]
display_name = "K3-256k"
support_efforts = [ "low", "high", "max" ]
default_effort = "high"

[models."kimi-code/k3.1-pro-highspeed"]
provider = "managed:kimi-code"
model = "k3.1-pro-highspeed"
max_context_size = 1048576
capabilities = [ "thinking", "always_thinking", "image_in", "video_in", "tool_use", "dynamically_loaded_tools" ]
display_name = "K3.1 Pro Highspeed"
support_efforts = [ "low", "high", "max" ]
default_effort = "high"

[models."kimi-code/k3"]
provider = "managed:kimi-code"
model = "k3"
max_context_size = 262144
capabilities = [ "thinking", "always_thinking", "image_in", "video_in", "tool_use", "dynamically_loaded_tools" ]
display_name = "K3"
support_efforts = [ "low", "high", "max" ]
default_effort = "high"

[models."kimi-code/k3.1-pro"]
provider = "managed:kimi-code"
model = "k3.1-pro"
max_context_size = 262144
capabilities = [ "thinking", "always_thinking", "image_in", "video_in", "tool_use", "dynamically_loaded_tools" ]
display_name = "K3.1 Pro"
support_efforts = [ "low", "high", "max" ]
default_effort = "high"

[thinking]
enabled = true
effort = "high"

[services.moonshot_search]
base_url = "https://api.kimi.com/coding/v1/search"
api_key = ""

[services.moonshot_search.oauth]
storage = "file"
key = "oauth/kimi-code"

[services.moonshot_fetch]
base_url = "https://api.kimi.com/coding/v1/fetch"
api_key = ""

[services.moonshot_fetch.oauth]
storage = "file"
key = "oauth/kimi-code"

[[hooks]]
event = "PreToolUse"
matcher = "Bash"
command = "bash \"${KIMI_CODE_HOME:-$HOME/.kimi-code}/hooks/safety-adapter.sh\" shell"
timeout = 5

[[hooks]]
event = "PreToolUse"
matcher = "Write|Edit"
command = "bash \"${KIMI_CODE_HOME:-$HOME/.kimi-code}/hooks/safety-adapter.sh\" write"
timeout = 5

[[hooks]]
event = "SessionStart"
command = "node \"${KIMI_CODE_HOME:-$HOME/.kimi-code}/hooks/caveman-activate.js\""
timeout = 5

[[hooks]]
event = "SessionStart"
command = "if [ ! -f \"${AGENT_STATE_DIR:-${XDG_CONFIG_HOME:-$HOME/.config}/agent-state}/lofi-off\" ]; then cat \"${XDG_CONFIG_HOME:-$HOME/.config}/agent-styles/lofi.md\"; fi"
timeout = 5

[[hooks]]
event = "UserPromptSubmit"
command = "node \"${KIMI_CODE_HOME:-$HOME/.kimi-code}/hooks/caveman-mode-tracker.js\""
timeout = 5

[[hooks]]
event = "UserPromptSubmit"
command = "if [ ! -f \"${AGENT_STATE_DIR:-${XDG_CONFIG_HOME:-$HOME/.config}/agent-state}/lofi-off\" ]; then cat \"${XDG_CONFIG_HOME:-$HOME/.config}/agent-styles/lofi-reminder.md\"; fi"
timeout = 5
