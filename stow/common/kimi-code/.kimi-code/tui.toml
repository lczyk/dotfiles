# ~/.kimi-code/tui.toml
# Client preferences for kimi-code.
# Agent/runtime settings stay in ~/.kimi-code/config.toml.

theme = "auto" # "auto" | "dark" | "light" | custom theme name
tui_mode = "regular" # "regular" | "fullscreen" ("fullscreen" is experimental)
render_latex = true # false keeps LaTeX math in assistant messages as raw source
disable_paste_burst = false # true disables non-bracketed paste-burst fallback
cache_expiry_hint = true # false disables the "cache expired" dialog on resume / idle submit
auto_session_title = true # false stops the TUI from auto-generating a session title after the first turn

[editor]
command = "" # Empty uses $VISUAL / $EDITOR

[notifications]
enabled = true # true | false
notification_condition = "unfocused" # "unfocused" | "always"

[upgrade]
auto_install = true # true | false

# [markdown]
# Draw mermaid code blocks as diagrams in the terminal; "off" keeps highlighted source.
# mermaid = "final" # "final" | "off"

[status_line]
# Pick and order the built-in footer slots: mode, goal, model, tasks, cwd, git, tips
# items = ["mode","goal","model","tasks","cwd","git","tips"]
# Render the shared badge dispatcher; Kimi passes its JSON snapshot on stdin.
command = "bash \"${KIMI_CODE_HOME:-$HOME/.kimi-code}/statusline.sh\""
