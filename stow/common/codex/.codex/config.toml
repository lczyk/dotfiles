approvals_reviewer = "user"

# marks shell commands as agent-run, so the git hooks take their strict path.
[shell_environment_policy]
set = { AGENT_SESSION = "1" }

[tui]
status_line = [
    "model-with-reasoning",
    "context-remaining",
    "five-hour-limit",
    "weekly-limit",
    "git-branch",
    "fast-mode",
    #
]


[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"
