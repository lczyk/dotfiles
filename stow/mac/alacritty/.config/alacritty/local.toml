[font]
size = 20.0

[font.normal]
family = "Ubuntu Mono"
style = "Regular"

[font.bold]
family = "Ubuntu Mono"
style = "Bold"

[font.italic]
family = "Ubuntu Mono"
style = "Italic"

[font.bold_italic]
family = "Ubuntu Mono"
style = "Bold Italic"

[font.offset]
x = 0
y = 1

[window]
opacity = 0.9
decorations = "buttonless"
# treat option as alt so option+letter / option+backspace carry alt mod into apps.
option_as_alt = "Both"

[[keyboard.bindings]]
key = "N"
mods = "Command"
action = "CreateNewWindow"

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"

# option_as_alt = "Both" eats option+3, which is how macos types `#`.
# rebind it back explicitly. add more glyphs here if other option-composed
# chars start going missing.
[[keyboard.bindings]]
key = "Key3"
mods = "Alt"
chars = "#"

# alacritty encodes Command as Super in the kitty protocol on its own, so any
# cmd chord it does not claim for itself arrives intact with no binding at all.
# only the ones alacritty claims need an entry here -- and a `chars` rewrite
# that sends different bytes breaks the chord rather than forwarding it.

# cmd+f split per screen mode, same shape as cmd+c below:
#   alt screen (TUI apps like `edit`) -> forward to program.
#   normal screen (shell)             -> alacritty's own search.
[[keyboard.bindings]]
key = "F"
mods = "Command"
mode = "Alt"
action = "ReceiveChar"

[[keyboard.bindings]]
key = "F"
mods = "Command"
mode = "~Alt"
action = "SearchForward"

# cmd+c split per screen mode:
#   alt screen (TUI apps like `edit`) -> forward to program.
#   normal screen (shell)             -> default Copy.
# defining the user binding shadows default for both modes, so normal-screen
# behaviour has to be re-registered explicitly.
[[keyboard.bindings]]
key = "C"
mods = "Command"
mode = "Alt"
action = "ReceiveChar"

[[keyboard.bindings]]
key = "C"
mods = "Command"
mode = "~Alt"
action = "Copy"

# shift+left-click default in alacritty is PasteSelection (paste PRIMARY).
# scope the default to the normal screen only -- in alt screen (TUI apps
# like `edit`) the event must pass through so apps can extend-selection-to-
# click. mode `~Alt` matches "not alt screen".
[[mouse.bindings]]
mouse = "Left"
mods = "Shift"
mode = "~Alt"
action = "PasteSelection"
